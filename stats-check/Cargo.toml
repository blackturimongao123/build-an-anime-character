[package]
name = "stats-check"
version = "0.1.0"
edition = "2021"
description = "Parallel VS Battles stat verification (Build an Anime Character)"

[[bin]]
name = "stats-check"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "fs", "time"] }
