[package]
name = "wiki-db"
version = "0.1.0"
edition = "2021"
description = "Searchable local DB for VS Battles wiki tab/column stat scrapes"

[[bin]]
name = "wiki-db"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
